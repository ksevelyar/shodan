[package]
name = "shodan"
version = "0.16.0"
edition = "2024"

[lib]
test = false
doctest = false

[[bin]]
name = "shodan"
test = false

[dependencies]
axum = "0.8"
base64 = "0.23"
crossterm = { version = "0.29", features = ["event-stream"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
globset = "0.4.22"
ignore = "0.4.35"
pulldown-cmark = "0.13"
ratatui = "0.30"
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["stream", "json", "rustls", "socks"], default-features = false }
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
similar = "2.7"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-onig"] }
textwrap = "0.16.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
unicode-width = "0.2.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = "0.8"
portable-pty = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-stream = "0.1"

[[bench]]
name = "conversation"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
