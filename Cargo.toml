[package]
name = "shodan"
version = "0.5.1"
edition = "2024"

[lib]
test = false
doctest = false

[[bin]]
name = "shodan"
test = false

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
ratatui = "0.30"
reqwest = { version = "0.13.5", features = ["stream", "json"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
textwrap = "0.16.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
unicode-width = "0.2.3"

[dev-dependencies]
axum = "0.8"
portable-pty = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-stream = "0.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
